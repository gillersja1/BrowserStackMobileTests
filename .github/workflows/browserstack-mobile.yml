name: BrowserStack Mobile Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  mobile-tests:
    name: Mobile Tests (BrowserStack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # Overwrites the placeholder credentials in browserstack.yml with real
      # values from repo secrets, so nothing sensitive is ever committed.
      - name: Inject BrowserStack credentials
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          sed -i "s/YOUR_USERNAME/${BROWSERSTACK_USERNAME}/" browserstack.yml
          sed -i "s/YOUR_ACCESS_KEY/${BROWSERSTACK_ACCESS_KEY}/" browserstack.yml

      - name: Run mobile tests on BrowserStack
        run: >
          dotnet test --no-build
          --logger "trx;LogFileName=mobile-test-results.trx"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browserstack-mobile-test-results
          path: ./TestResults
