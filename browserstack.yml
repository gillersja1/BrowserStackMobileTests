# BrowserStack SDK configuration.
#
# IMPORTANT: Do not commit real credentials here. Either:
#   1. Run `dotnet browserstack-sdk setup --userName "..." --accessKey "..."`
#      locally to populate this file (then keep it out of git), or
#   2. Leave the placeholders below and export BROWSERSTACK_USERNAME /
#      BROWSERSTACK_ACCESS_KEY as environment variables in CI, where the
#      workflow overwrites this file at runtime (see .github/workflows).
userName: YOUR_USERNAME
accessKey: YOUR_ACCESS_KEY

framework: playwright

# Real mobile devices to run this suite against. Add/remove entries to
# change coverage. Full device list:
# https://www.browserstack.com/list-of-browsers-and-platforms/playwright
platforms:
  - deviceName: Samsung Galaxy S23 Ultra
    browserName: chrome
    osVersion: "13.0"

  - deviceName: iPhone 15 Pro Max
    browserName: safari
    osVersion: "17"

  - deviceName: Google Pixel 8
    browserName: chrome
    osVersion: "14.0"

buildName: mobile-showcase-build
projectName: BrowserStackMobileTests

# Debugging/reporting features
debug: true
networkLogs: true
video: true
consoleLogs: info
